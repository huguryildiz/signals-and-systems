<script>
/* ---------- assemble the scene list from the content modules ---------- */
(function(){
  /* Modules 2–7 open with the taxonomy of the question types that recur in
     their practice questions. Every module closes with its questions after the
     teaching scenes. The scene objects carry their module id, so the contents
     rail and the module list need no separate entry. */
  const SCENES = [].concat(
    window.SCENES_M0||[],
    window.SCENES_M1||[], window.DRILL_M1||[],
    window.DRILLMAP_M2||[], window.SCENES_M2||[], window.DRILL_M2||[],
    window.DRILLMAP_M3||[], window.SCENES_M3||[], window.DRILL_M3||[],
    window.DRILLMAP_M4||[], window.SCENES_M4||[], window.DRILL_M4||[],
    window.DRILLMAP_M5||[], window.SCENES_M5||[], window.DRILL_M5||[],
    window.DRILLMAP_M6||[], window.SCENES_M6||[], window.DRILL_M6||[],
    window.DRILLMAP_M7||[], window.SCENES_M7||[], window.DRILL_M7||[],
    window.SCENES_END||[]
  );

  /* glossary + conventions + help panels */
  const gh = document.getElementById('glosshost');
  gh.innerHTML = Object.entries(CONTENT.GLOSS).map(([k,v])=>
    `<div class="gitem" id="g-${k}"><div class="gs">${RENDER.tex(v.s, false)}</div>
      <div class="gd">${RENDER.md(v.d)}${v.go?` <a data-act="goto" data-id="${v.go}">go to definition →</a>`:''}</div></div>`).join('');
  document.getElementById('convhost').innerHTML = [
    ['CTFT', CONTENT.META.conventions.ctft],
    ['DTFT', CONTENT.META.conventions.dtft]
  ].map(([n,t])=>`<div class="gitem"><div class="gs"><span class="eq-label">${n}</span></div>
      <div class="gd">${RENDER.tex(t,false)}</div></div>`).join('')
    + `<div class="gitem"><div class="gs"><span class="eq-label">sinc</span></div><div class="gd">${RENDER.md(CONTENT.META.conventions.sinc)}</div></div>`
    + `<div class="gitem"><div class="gs"><span class="eq-label">energy</span></div><div class="gd">${RENDER.md(CONTENT.META.conventions.energy)}</div></div>`;
  document.getElementById('helphost').innerHTML = [
    ['→ / space','Advance one reveal state, then one scene'],
    ['←','Step back one reveal state, then one scene'],
    ['↑ / ↓','Previous / next scene, ignoring reveal states'],
    ['Home / End','First / last scene'],
    ['M','Contents overlay'],['/ or F','Full-text search'],['G','Notation glossary'],
    ['S','Show or hide the contents rail'],
    ['P','Normal ⇄ projector size; in projector size the mouse becomes a laser pointer'],
    ['T','Ink of that pointer: fades a few seconds after the button is let go, is held until it is cleared, or is off'],
    ['C','Clear the ink now; a change of scene clears it too'],
    ['D','Light ⇄ dark'],
    ['L','Lecture ⇄ self-study'],['I','Student ⇄ instructor edition'],['R','Reduced motion'],
    ['Esc','Close any overlay']
  ].map(([k,d])=>`<div class="gitem"><div class="gs"><kbd>${k}</kbd></div><div class="gd">${d}</div></div>`).join('');

  /* Addresses and textbook anchors are derived from the single declaration in
     `89_sections.js` and hung on the scene objects here, before anything reads
     them. The chapter view it returns is what the contents surfaces render. */
  const CHAPTERS = window.applyNumbering(SCENES);

  APP.init({ scenes:SCENES, modules:CONTENT.MODULES, chapters:CHAPTERS, render:RENDER.draw });
  APP.wireSearch();
  RENDER.draw();
})();
</script>
</body>
</html>
