<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256"
     role="img" aria-label="Signals and Systems">
  <title>Signals and Systems</title>

  <!-- The course badge is the oscilloscope screen of the title figure: a cyan
       phosphor trace on a dark tube, drawn in the screen colours the artifact
       reserves for it. The signal is the ideal lowpass response, main lobe and
       three side lobes either way, ending on a zero. -->

  <defs>
    <filter id="phos" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
    <clipPath id="face">
      <rect x="4" y="4" width="56" height="56" rx="13"/>
    </clipPath>
  </defs>

  <style>
    .face { fill: #0A0F12; }
    .edge { fill: none; stroke: #25343A; stroke-width: 1.5; }
    .grat { stroke: #1E2A2E; stroke-width: 0.4; }
    .axis { stroke: #31474B; stroke-width: 0.6; }
    .scan { stroke: #060B0D; stroke-width: 0.45; }
    .glow { fill: none; stroke: #4FBECE; stroke-width: 5; opacity: .32;
            filter: url(#phos); stroke-linecap: round; }
    .trace{ fill: none; stroke: #4FBECE; stroke-width: 2.4;
            stroke-linecap: round; stroke-linejoin: round; }

    /* One 7 s cycle sends the beam along the trace: a bright head with a
       fading tail behind it. Nothing is displaced, so the resting figure is
       the complete one — which is also what a still or a print shows. */
    .beam { fill: none; stroke: #CFF3FA; stroke-width: 2.6;
            stroke-linecap: round;
            stroke-dasharray: 14 400; stroke-dashoffset: 14;
            animation: beam 7s cubic-bezier(.4,0,.5,1) infinite; }
    .tail { fill: none; stroke: #4FBECE; stroke-width: 4.4; opacity: .55;
            stroke-linecap: round; filter: url(#phos);
            stroke-dasharray: 46 400; stroke-dashoffset: 46;
            animation: tail 7s cubic-bezier(.4,0,.5,1) infinite; }

    @keyframes beam { 0%       { stroke-dashoffset: 14 }
                      26%,100% { stroke-dashoffset: -102.4 } }
    @keyframes tail { 0%       { stroke-dashoffset: 46 }
                      26%,100% { stroke-dashoffset: -70.4 } }

    @media (prefers-reduced-motion: reduce) { .beam, .tail { display: none; } }
  </style>

  <rect class="face" x="4" y="4" width="56" height="56" rx="13"/>

